# 원자료 매니페스트 — src/hri/paths.py 의 원자료 상수와 1:1 대응한다.
# 검사: python -m hri.check_data   (존재·SHA256 확인, 누락 시 출처 안내)
#
# 필드
#   key               paths.py 상수명 (dict 상수는 KEY[권역])
#   path              data/raw/ 기준 상대경로
#   used              preprocess 파이프라인이 실제로 읽는지 (false면 누락돼도 실패하지 않음)
#   org / source      출처 기관 / 수록 통계·포털
#   table_name        다운로드 화면의 통계표명 (파일 헤더 기준)
#   table_id          통계표 ID. 확인하지 못한 값은 null (추측해서 채우지 않음)
#   url               다운로드 경로 (통계표 직링크를 확인하지 못한 경우 포털 주소)
#   downloaded        다운로드 날짜 (파일 생성일 기준)
#   reference_period  자료의 기준 시점 (파일 내부 표기 기준)
#   sha256            파일 해시
#
# 주의: HIRA 공급측 자료(인력·전문의·시설·장비·특수진료실)는 2026년 1분기 기준이고,
#       수요·결과측 자료(인구·미충족의료·관외이용·의료급여)는 2024년 기준이다.

